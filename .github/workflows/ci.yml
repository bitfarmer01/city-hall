name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityhall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cityhall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cityhall
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Postgres + pgvector service
        run: |
          pg_isready -h localhost -p 5432 -U postgres -d cityhall
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';" \
            -c "SELECT '[1,2,3]'::vector;"

      - name: Catalog drift check
        run: |
          # Rebuilding the committed catalog must be byte-identical — the
          # build re-runs the linker's full validation on every PR.
          npm run catalog:build

      - name: Check A committed-sample coherence
        run: |
          # The committed 100-article sample must still be what the pinned
          # seed derives from the stored snapshot — a snapshot refresh that
          # skips re-committing the sample fails here, before the gate math
          # can silently compare across incomparable samples. The live fetch
          # runs on the weekly schedule (workflows/check-a.yml).
          npm run check:a -- --sample-only

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Replay snapshot gate
        run: npm run replay

      - name: Build
        run: npm run build

      - name: Smoke test /api/health
        run: |
          # Background output must be redirected: a process holding the
          # step's stdout pipe keeps the runner waiting on EOF.
          npx next start -p 3100 >/tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null' EXIT
          node scripts/smoke-health.mjs http://localhost:3100/api/health
          RC=$?
          cat /tmp/next-start.log
          exit $RC

  python:
    name: Python extraction toolchain (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned toolchain
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r python/requirements.txt

      - name: Run toolchain smoke tests
        run: .venv/bin/python -m pytest python/tests -q
