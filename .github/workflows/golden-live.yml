name: Golden set live drift check (Check B)

# Weekly live leg of Check B (spec D10): re-capture every public golden
# target, diff live-minus-catalog against the committed baselines, and
# re-hash PDF fixtures against upstream. Pages and forms drift without any
# code change, so this runs on a schedule — a failing run means a target
# moved and the baselines (or the catalog) need human review. Offline PR
# gating lives in ci.yml.

on:
  schedule:
    # Sundays 06:00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  golden-live:
    name: Live capture + zero-miss diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run live drift check
        run: npm run golden:live

      - name: Upload weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-weekly-report
          path: data/golden/weekly-report.md
          if-no-files-found: warn
